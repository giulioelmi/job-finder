<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bamboo Job Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 300px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 13px;
      color: #111827;
      background: #f7faf8;
    }

    .header {
      background: #15803d;
      padding: 16px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-icon { font-size: 22px; line-height: 1; }
    .header-title { color: #fff; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; }
    .header-sub { color: rgba(255,255,255,0.75); font-size: 11px; margin-top: 1px; }

    .body { padding: 18px; }

    /* ── Login form ── */
    .field { margin-bottom: 12px; }
    .field label { display: block; font-size: 11px; font-weight: 600; color: #6b7280; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.06em; }
    .field input {
      width: 100%; border: 1.5px solid #d1d5db; border-radius: 8px;
      padding: 8px 10px; font-size: 13px; color: #111827; outline: none;
      font-family: inherit; transition: border-color 0.15s; background: #fff;
    }
    .field input:focus { border-color: #15803d; }

    .btn-primary {
      width: 100%; padding: 10px; background: #15803d; color: #fff;
      border: none; border-radius: 9px; font-size: 13px; font-weight: 600;
      cursor: pointer; font-family: inherit; letter-spacing: 0.01em;
      transition: background 0.15s; margin-top: 4px;
    }
    .btn-primary:hover { background: #166534; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .error-msg {
      background: #fef2f2; color: #dc2626; border-radius: 7px;
      padding: 8px 10px; font-size: 12px; margin-bottom: 12px;
      display: none;
    }

    /* ── Logged-in state ── */
    .logged-in { text-align: center; padding: 4px 0 8px; }
    .logged-in .avatar {
      width: 44px; height: 44px; background: #dcfce7; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; margin: 0 auto 10px;
    }
    .logged-in .name { font-weight: 600; font-size: 14px; color: #111827; }
    .logged-in .email { color: #6b7280; font-size: 12px; margin-top: 2px; margin-bottom: 14px; }

    .status-pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: #f0fdf4; color: #15803d; border-radius: 20px;
      padding: 5px 12px; font-size: 12px; font-weight: 500;
      border: 1px solid #bbf7d0; margin-bottom: 16px;
    }
    .status-dot { width: 7px; height: 7px; background: #15803d; border-radius: 50%; }

    .btn-secondary {
      width: 100%; padding: 9px; background: #fff; color: #374151;
      border: 1.5px solid #d1d5db; border-radius: 9px; font-size: 13px;
      font-weight: 500; cursor: pointer; font-family: inherit;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #f9fafb; }

    .hint {
      color: #9ca3af; font-size: 11px; text-align: center;
      margin-top: 14px; line-height: 1.5;
    }

    #login-view, #loggedin-view { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🎋</span>
    <div>
      <div class="header-title">Bamboo Tracker</div>
      <div class="header-sub">Job application tracker</div>
    </div>
  </div>

  <div class="body">

    <!-- Login view -->
    <div id="login-view">
      <div class="field">
        <label>Email</label>
        <input id="email" type="email" placeholder="you@example.com" autocomplete="email" />
      </div>
      <div class="field">
        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </div>
      <div id="error-msg" class="error-msg"></div>
      <button id="login-btn" class="btn-primary">Sign in</button>
      <p class="hint">Sign in with your Bamboo account to start tracking applications.</p>
    </div>

    <!-- Logged-in view -->
    <div id="loggedin-view">
      <div class="logged-in">
        <div class="avatar">🎋</div>
        <div class="name">Signed in</div>
        <div class="email" id="user-email"></div>
        <div class="status-pill">
          <span class="status-dot"></span>
          Extension active
        </div>
      </div>
      <button id="logout-btn" class="btn-secondary">Sign out</button>
      <p class="hint">Visit any job page and click the 🎋 button<br>in the top-right to track your application.</p>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
